    <style>

        #menu-drawer {
            position: fixed; top: calc(max(8px, env(safe-area-inset-top)) + 42px); left: max(10px, env(safe-area-inset-left));
            background: rgba(15, 22, 30, 0.95); border: 1px solid rgba(255, 255, 255, 0.2);

        button {

        .modal {

            border: 2px solid rgba(255, 255, 255, 0.28); display: flex; align-items: center; justify-content: center;
            z-index: 20; opacity: 0.48; transition: opacity 0.15s; touch-action: none;
        }
        #joystick-zone.active { opacity: 0.9; border-color: rgba(112, 161, 255, 0.8); background: rgba(112, 161, 255, 0.14); }
        #joystick-knob {
            width: 44px; height: 44px; border-radius: 50%;
            background: radial-gradient(circle at 35% 35%, rgba(255, 255, 255, 0.92), rgba(180, 210, 255, 0.72));
            box-shadow: 0 4px 14px rgba(0, 0, 0, 0.45); pointer-events: none; transform: translate(0px, 0px);
        }

        #kick-btn {

        #hint {

            #hint { display: none; }
            .hide-sm { display: none; }
            .glass-pill { padding: 4px 9px; font-size: 11px; }

            .score-item { font-size: 11px; padding: 2px 5px; }

            #kick-btn span { font-size: 20px; }
        }

<body>
    <div id="topbar">
        <div class="top-left">
            <button id="menu-toggle" class="glass-pill">⚙️ 選單</button>
            <div id="room-pill" class="glass-pill room-pill connecting">⏳ 連線中</div>

        <div class="top-right">

    </div>

    <div id="menu-drawer">

        <div class="btn-row">

    <div id="gameover">

    <div id="joystick-zone"><div id="joystick-knob"></div></div>

    <div id="hint">WASD/方向鍵 移動 · <b>空白鍵</b>：有球踢球 ／ 沒球衝刺閃避 · 移動流暢極速版</div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://unpkg.com/mqtt@5.15.2/dist/mqtt.min.js"></script>
    <script>
        // mqtt.js 備援：unpkg 載入失敗時改用 jsdelivr；兩邊都失敗由啟動守門顯示單機模式
        (function () {
            if (typeof window.mqtt !== 'undefined') return;
            var s = document.createElement('script');
            s.src = 'https://cdn.jsdelivr.net/npm/mqtt@5.15.2/dist/mqtt.min.js';
            s.onerror = function () { window.__mqttFailed = true; };
            document.head.appendChild(s);
        })();
    </script>
    <script>
        ['gesturestart', 'gesturechange', 'gestureend'].forEach(ev => {
            document.addEventListener(ev, e => e.preventDefault(), { passive: false });
        });
        let lastTouchEnd = 0;
        document.addEventListener('touchend', e => {
            const t = e.target;
            if (t && (t.tagName === 'INPUT' || t.tagName === 'BUTTON' || t.closest('button'))) return;
            const now = Date.now();
            if (now - lastTouchEnd <= 300) e.preventDefault();
            lastTouchEnd = now;
        }, { passive: false });

        // ===== 1. 難度與音效 =====
        const DIFFICULTIES = [
            { key: 'easy', label: '難度：輕鬆', cls: 'diff-easy', cpuSpeed: 3.1, cpuKickSpeed: 10.5, cpuCooldown: 1.9, cpuAimJitter: 0.75 },
            { key: 'normal', label: '難度：普通', cls: 'diff-normal', cpuSpeed: 4.0, cpuKickSpeed: 12.5, cpuCooldown: 1.35, cpuAimJitter: 0.45 },
            { key: 'hard', label: '難度：地獄', cls: 'diff-hard', cpuSpeed: 5.0, cpuKickSpeed: 15.0, cpuCooldown: 0.85, cpuAimJitter: 0.2 }
        ];
        let diffIndex = 0, soundEnabled = true, audioCtx = null;

        function initAudio() {
            if (!audioCtx) { const AC = window.AudioContext || window.webkitAudioContext; if (AC) audioCtx = new AC(); }
            if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
        }
        function playSound(type) {
            if (!soundEnabled) return;
            initAudio(); if (!audioCtx) return;
            const now = audioCtx.currentTime;
            if (type === 'kick' || type === 'counter') {
                const osc = audioCtx.createOscillator(), g = audioCtx.createGain();
                osc.type = type === 'counter' ? 'sawtooth' : 'triangle';
                osc.frequency.setValueAtTime(type === 'counter' ? 380 : 220, now);
                osc.frequency.exponentialRampToValueAtTime(65, now + 0.14);
                g.gain.setValueAtTime(0.32, now); g.gain.exponentialRampToValueAtTime(0.01, now + 0.14);
                osc.connect(g); g.connect(audioCtx.destination); osc.start(now); osc.stop(now + 0.15);
            } else if (type === 'dash') {
                const osc = audioCtx.createOscillator(), g = audioCtx.createGain();
                osc.type = 'sine'; osc.frequency.setValueAtTime(180, now); osc.frequency.exponentialRampToValueAtTime(480, now + 0.12);
                g.gain.setValueAtTime(0.18, now); g.gain.exponentialRampToValueAtTime(0.01, now + 0.13);
                osc.connect(g); g.connect(audioCtx.destination); osc.start(now); osc.stop(now + 0.14);
            } else if (type === 'bounce') {
                const osc = audioCtx.createOscillator(), g = audioCtx.createGain();
                osc.type = 'sine'; osc.frequency.setValueAtTime(340, now); osc.frequency.exponentialRampToValueAtTime(560, now + 0.08);
                g.gain.setValueAtTime(0.16, now); g.gain.exponentialRampToValueAtTime(0.01, now + 0.09);
                osc.connect(g); g.connect(audioCtx.destination); osc.start(now); osc.stop(now + 0.1);
            } else if (type === 'explode') {
                const buf = audioCtx.createBuffer(1, audioCtx.sampleRate * 0.35, audioCtx.sampleRate), d = buf.getChannelData(0);
                for (let i = 0; i < d.length; i++) d[i] = (Math.random() * 2 - 1) * Math.exp(-i / (audioCtx.sampleRate * 0.09));
                const n = audioCtx.createBufferSource(); n.buffer = buf;
                const f = audioCtx.createBiquadFilter(); f.type = 'lowpass';
                f.frequency.setValueAtTime(750, now); f.frequency.exponentialRampToValueAtTime(80, now + 0.35);
                const g = audioCtx.createGain(); g.gain.setValueAtTime(0.5, now); g.gain.exponentialRampToValueAtTime(0.01, now + 0.35);
                n.connect(f); f.connect(g); g.connect(audioCtx.destination); n.start(now);
            } else if (type === 'win') {
                [523.25, 659.25, 783.99, 1046.5].forEach((freq, i) => {
                    const osc = audioCtx.createOscillator(), g = audioCtx.createGain();
                    osc.type = 'triangle'; osc.frequency.setValueAtTime(freq, now + i * 0.1);
                    g.gain.setValueAtTime(0.2, now + i * 0.1); g.gain.exponentialRampToValueAtTime(0.01, now + i * 0.1 + 0.25);
                    osc.connect(g); g.connect(audioCtx.destination); osc.start(now + i * 0.1); osc.stop(now + i * 0.1 + 0.26);
                });
            }
        }

        // ===== 2. 3D 場景與 iPad 效能／縮放優化 =====
        const ARENA_W = 16, ARENA_H = 12, HALF_W = 8, HALF_H = 6, WIN_KO = 5;
        const PLAYER_SPEED = 6.3, P_RADIUS = 0.42, B_RADIUS = 0.42;

        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x141b24);
        const camera = new THREE.PerspectiveCamera(45, 1, 0.1, 140);
        const baseCamPos = new THREE.Vector3(0, 18, 13.5);

        const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
        renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 1.5)); // iPad Retina 降負載保持滿幀 60fps
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFShadowMap;
        document.body.appendChild(renderer.domElement);

        function updateCameraFraming() {
            const vv = window.visualViewport;
            const w = Math.max(document.documentElement.clientWidth || window.innerWidth, vv ? vv.width : 0);
            const h = Math.max(document.documentElement.clientHeight || window.innerHeight, vv ? vv.height : 0);
            const aspect = w / Math.max(h, 1);
            camera.aspect = aspect; camera.updateProjectionMatrix();

            const fovRad = THREE.MathUtils.degToRad(camera.fov);
            const tanHalf = Math.tan(fovRad / 2);
            const targetW = 22.0, targetH = (h < 560) ? 17.5 : 16.5;
            const dist = Math.max((targetH / 2) / tanHalf, (targetW / 2) / (tanHalf * aspect), 20.5);

            baseCamPos.set(0, dist * 0.80, dist * 0.60);
            camera.position.copy(baseCamPos);
            camera.lookAt(0, 0, 0.25);
            renderer.setSize(w, h, false);
        }
        updateCameraFraming();

        scene.add(new THREE.AmbientLight(0xffffff, 0.55));
        const dirLight = new THREE.DirectionalLight(0xffffff, 0.85);
        dirLight.position.set(7, 22, 10); dirLight.castShadow = true;
        dirLight.shadow.mapSize.width = 1024; dirLight.shadow.mapSize.height = 1024;
        dirLight.shadow.camera.near = 1; dirLight.shadow.camera.far = 45;
        dirLight.shadow.camera.left = -12; dirLight.shadow.camera.right = 12;
        dirLight.shadow.camera.top = 12; dirLight.shadow.camera.bottom = -12;
        scene.add(dirLight);

        function createCourtTexture() {
            const c = document.createElement('canvas'); c.width = 1024; c.height = 768;
            const ctx = c.getContext('2d'), cw = c.width / 16, ch = c.height / 12;
            for (let r = 0; r < 12; r++) for (let col = 0; col < 16; col++) {
                ctx.fillStyle = (r + col) % 2 === 0 ? '#27ae60' : '#2ecc71';
                ctx.fillRect(col * cw, r * ch, cw + 1, ch + 1);
            }
            ctx.strokeStyle = 'rgba(255,255,255,0.72)'; ctx.lineWidth = 8; ctx.strokeRect(20, 20, c.width - 40, c.height - 40);
            ctx.beginPath(); ctx.moveTo(c.width / 2, 20); ctx.lineTo(c.width / 2, c.height - 20); ctx.stroke();
            ctx.beginPath(); ctx.arc(c.width / 2, c.height / 2, 105, 0, Math.PI * 2); ctx.stroke();
            ctx.fillStyle = 'rgba(255,255,255,0.72)'; ctx.beginPath(); ctx.arc(c.width / 2, c.height / 2, 10, 0, Math.PI * 2); ctx.fill();
            ctx.beginPath(); ctx.arc(20, c.height / 2, 130, -Math.PI / 2, Math.PI / 2); ctx.stroke();
            ctx.beginPath(); ctx.arc(c.width - 20, c.height / 2, 130, Math.PI / 2, Math.PI * 1.5); ctx.stroke();
            return new THREE.CanvasTexture(c);
        }
        function createWallTexture() {
            const c = document.createElement('canvas'); c.width = 128; c.height = 128;
            const ctx = c.getContext('2d');
            ctx.fillStyle = '#3d4854'; ctx.fillRect(0, 0, 128, 128);
            ctx.strokeStyle = '#252d36'; ctx.lineWidth = 4; ctx.strokeRect(2, 2, 124, 124);
            ctx.beginPath(); ctx.moveTo(0, 64); ctx.lineTo(128, 64); ctx.moveTo(64, 0); ctx.lineTo(64, 64);
            ctx.moveTo(32, 64); ctx.lineTo(32, 128); ctx.moveTo(96, 64); ctx.lineTo(96, 128); ctx.stroke();
            return new THREE.CanvasTexture(c);
        }

        const floor = new THREE.Mesh(new THREE.PlaneGeometry(ARENA_W, ARENA_H), new THREE.MeshStandardMaterial({ map: createCourtTexture(), roughness: 0.85 }));
        floor.rotation.x = -Math.PI / 2; floor.receiveShadow = true; scene.add(floor);

        const wallGeo = new THREE.BoxGeometry(1, 1.15, 1), wallMat = new THREE.MeshStandardMaterial({ map: createWallTexture(), roughness: 0.55 });
        for (let x = -HALF_W - 0.5; x <= HALF_W + 0.5; x += 1) [-HALF_H - 0.5, HALF_H + 0.5].forEach(z => {
            const w = new THREE.Mesh(wallGeo, wallMat); w.position.set(x, 0.575, z); w.castShadow = true; w.receiveShadow = true; scene.add(w);
        });
        for (let z = -HALF_H + 0.5; z <= HALF_H - 0.5; z += 1) [-HALF_W - 0.5, HALF_W + 0.5].forEach(x => {
            const w = new THREE.Mesh(wallGeo, wallMat); w.position.set(x, 0.575, z); w.castShadow = true; w.receiveShadow = true; scene.add(w);
        });

        // ===== 3. 共用幾何體與物件池 =====
        const PLAYER_CONFIGS = [
            { slot: 0, defaultName: '藍 CPU', colorName: '藍', color: '#2e86de', spawn: [-5.5, -3.5] },
            { slot: 1, defaultName: '紅 CPU', colorName: '紅', color: '#ee5253', spawn: [5.5, 3.5] },
            { slot: 2, defaultName: '綠 CPU', colorName: '綠', color: '#10ac84', spawn: [5.5, -3.5] },
            { slot: 3, defaultName: '黃 CPU', colorName: '黃', color: '#ff9f43', spawn: [-5.5, 3.5] }
        ];
        let players = [], bombs = [], nextBombId = 1, clientBombs = new Map(), effects = [];
        let gameStartTime = 0, clientElapsed = 0, spawnTimer = 0, spawnQuadrant = 0, gameOver = false, screenShake = 0;

        const BROKERS = [
            { url: 'wss://broker.mqttgo.io:8084/mqtt', min: 1000, max: 3999, label: '台灣' },
            { url: 'wss://broker.emqx.io:8084/mqtt', min: 4000, max: 6999, label: '亞太' },
            { url: 'wss://mqtt.eclipseprojects.io:443/mqtt', min: 7000, max: 9999, label: '443通道' }
        ];
        const myClientId = 'bd_' + Math.random().toString(36).slice(2, 10);
        let currentBrokerIdx = 0, isHost = true, mySlot = 0, mqttClient = null, myRoomCode = '';
        let remoteClients = new Map(), joinTimeout = null, helloInterval = null, pingInterval = null, lastHostPacketAt = 0;

        const playersGroup = new THREE.Group(), bombsGroup = new THREE.Group(), fxGroup = new THREE.Group();

        const cylGeo = new THREE.CylinderGeometry(0.36, 0.36, 0.65, 20), domeGeo = new THREE.SphereGeometry(0.36, 20, 14);

        function createPlayerMesh(cfg) {

        function attachSelfMarker(slotIdx) { if (players[slotIdx] && players[slotIdx].mesh) players[slotIdx].mesh.add(selfMarkerGroup); }

        // ===== 4. UI 與初始化 =====
        const menuDrawer = document.getElementById('menu-drawer'), menuToggle = document.getElementById('menu-toggle');

        if (!document.documentElement.requestFullscreen && !document.documentElement.webkitRequestFullscreen) {

        function updateScoreboard() {

        function getOccupiedSlotsMap() {

        }
        function initPlayersStructure() {

            const occupied = getOccupiedSlotsMap();
            players = PLAYER_CONFIGS.map((cfg, idx) => {

        function clearEffects() {

        // ===== 5. 低延遲 MQTT 連線邏輯 (含線路切換與即時位置同步) =====
        const copyRoomBtn = document.getElementById('copy-room-btn'), joinInput = document.getElementById('join-input');
        const joinBtn = document.getElementById('join-btn'), leaveBtn = document.getElementById('leave-btn');
        const diffBtn = document.getElementById('diff-btn'), restartBtn = document.getElementById('restart-btn');
        const switchBrokerBtn = document.getElementById('switch-broker-btn');

        joinInput.addEventListener('blur', () => { setTimeout(() => { window.scrollTo(0, 0); updateCameraFraming(); }, 80); });

        function topicH2C(code) { return `bdodge/v3/${code}/h2c`; }
        function topicC2H(code) { return `bdodge/v3/${code}/c2h`; }
        function brokerIndexForCode(codeNum) {
            for (let i = 0; i < BROKERS.length; i++) if (codeNum >= BROKERS[i].min && codeNum <= BROKERS[i].max) return i;
            return 0;
        }
        function cleanupMqtt() {
            clearTimeout(joinTimeout); clearInterval(helloInterval); clearInterval(pingInterval);
            if (mqttClient) { try { mqttClient.end(true); } catch (e) {} mqttClient = null; }
        }
        function broadcastEvent(obj) {
            if (!isHost || !mqttClient || !mqttClient.connected || remoteClients.size === 0) return;
            mqttClient.publish(topicH2C(myRoomCode), JSON.stringify(obj), { qos: 0 });
        }

        function startHostMqtt(brokerIdx = 0) {
            if (typeof mqtt === 'undefined') {
                roomPill.className = 'glass-pill room-pill connecting';
                roomPill.textContent = '⚠️ 單機模式（連線元件載入失敗）';
                copyRoomBtn.style.display = 'none';

                return;

            cleanupMqtt(); isHost = true; mySlot = 0; remoteClients.clear();
            currentBrokerIdx = brokerIdx;
            diffBtn.disabled = false; restartBtn.disabled = false; switchBrokerBtn.disabled = false;
            joinInput.style.display = ''; joinBtn.style.display = ''; leaveBtn.style.display = 'none';

            if (brokerIdx >= BROKERS.length) {
                roomPill.className = 'glass-pill room-pill connecting'; roomPill.textContent = '⚠️ 單機模式（3 個連線點都失敗，點我重試）';
                copyRoomBtn.style.display = 'none';
                roomPill.style.pointerEvents = 'auto';
                roomPill.style.cursor = 'pointer';
                roomPill.onclick = () => { roomPill.onclick = null; roomPill.style.pointerEvents = ''; roomPill.style.cursor = ''; startHostMqtt(0); };
                return;
            }
            const b = BROKERS[brokerIdx];
            const code = String(Math.floor(b.min + Math.random() * (b.max - b.min + 1)));
            myRoomCode = code;
            roomPill.className = 'glass-pill room-pill connecting'; roomPill.textContent = `⏳ ${b.label}`;
            copyRoomBtn.style.display = 'none';

            let settled = false;
            const client = mqtt.connect(b.url, { clientId: myClientId + '_' + Date.now().toString(36), protocolVersion: 4, clean: true, reconnectPeriod: 0, connectTimeout: 8000 });
            mqttClient = client;

            const failTimer = setTimeout(() => { if (!settled && mqttClient === client) startHostMqtt(brokerIdx + 1); }, 8500);
            client.on('connect', () => {
                settled = true; clearTimeout(failTimer);
                client.subscribe(topicC2H(code), { qos: 0 }, (err) => {
                    if (err) { startHostMqtt(brokerIdx + 1); return; }
                    roomPill.className = 'glass-pill room-pill'; roomPill.textContent = `🟢 ${code} (${b.label})`;
                    copyRoomBtn.style.display = '';

            client.on('message', (topic, payload) => {
                if (!isHost || mqttClient !== client) return;
                try { handleHostReceive(JSON.parse(typeof payload === 'string' ? payload : new TextDecoder().decode(payload))); } catch (e) {}
            });
            client.on('error', () => { if (!settled && mqttClient === client) { settled = true; clearTimeout(failTimer); startHostMqtt(brokerIdx + 1); } });
        }

        function clampPlayerPos(p, nx, nz) {
            p.x = Math.max(-HALF_W + P_RADIUS, Math.min(HALF_W - P_RADIUS, nx));
            p.z = Math.max(-HALF_H + P_RADIUS, Math.min(HALF_H - P_RADIUS, nz));
        }

        function handleHostReceive(data) {
            const cid = data.cid; if (!cid) return;
            if (data.t === 'ping') { mqttClient.publish(topicH2C(myRoomCode), JSON.stringify({ t: 'pong', cid, ts: data.ts }), { qos: 0 }); return; }
            if (data.t === 'hello') {
                let info = remoteClients.get(cid);
                if (!info) {
                    const occ = getOccupiedSlotsMap(); let freeSlot = -1;
                    for (let s = 1; s < 4; s++) if (!occ.has(s)) { freeSlot = s; break; }
                    if (freeSlot === -1) { mqttClient.publish(topicH2C(myRoomCode), JSON.stringify({ t: 'full', cid }), { qos: 0 }); return; }
                    info = { slot: freeSlot, lastSeen: performance.now() }; remoteClients.set(cid, info);
                    const p = players[freeSlot]; p.isHuman = true; p.name = `玩家${freeSlot + 1}`;
                    updateScoreboard(); showToast(`🎉 玩家${freeSlot + 1} (${p.colorName}) 加入房間！`);
                    broadcastEvent({ t: 'toast', msg: `🎉 玩家${freeSlot + 1} (${p.colorName}) 加入房間！` });
                    broadcastEvent({ t: 'names', n: players.map(pl => pl.name) });
                }
                info.lastSeen = performance.now();
                mqttClient.publish(topicH2C(myRoomCode), JSON.stringify({ t: 'welcome', cid, slot: info.slot, diffIndex, names: players.map(pl => pl.name) }), { qos: 0 });
                return;
            }
            const info = remoteClients.get(cid); if (!info) return;
            info.lastSeen = performance.now();
            const p = players[info.slot]; if (!p) return;

            if (data.t === 'pos' && p.alive) {
                // 接收遠端玩家精準座標 (僅在與本地 spawnSeq 同步時更新)
                if (data.seq === undefined || data.seq === p.spawnSeq) {
                    clampPlayerPos(p, Number(data.x) || 0, Number(data.z) || 0);
                    const dx = Number(data.dx) || 0, dz = Number(data.dz) || 0;
                    if (dx !== 0 || dz !== 0) {
                        const l = Math.hypot(dx, dz);
                        p.dirX = dx / l; p.dirZ = dz / l;
                        p.mesh.rotation.y = Math.atan2(p.dirX, p.dirZ);
                    }
                    p.mesh.position.set(p.x, 0, p.z);
                }
            } else if (data.t === 'act' && p.alive) {
                if (data.x !== undefined && data.z !== undefined) clampPlayerPos(p, Number(data.x) || 0, Number(data.z) || 0);
                if (data.dx !== undefined && data.dz !== undefined) {
                    const l = Math.hypot(data.dx, data.dz);
                    if (l > 0.01) { p.dirX = data.dx / l; p.dirZ = data.dz / l; p.mesh.rotation.y = Math.atan2(p.dirX, p.dirZ); }
                }
                if (data.act === 'dash') {
                    if (p.dashCooldown <= 0) {
                        p.dashCooldown = 1.0; p.invulnTimer = Math.max(p.invulnTimer, 0.30);
                        spawnRingFX(p.x, p.z, 0x70a1ff, 1.4, 0.25); playSound('dash');
                        broadcastEvent({ t: 'ev', skip: p.slot, s: 'dash', ring: [p.x, p.z, 0x70a1ff, 1.4, 0.25] });
                    }
                } else {
                    tryKick(p, true);
                }
            } else if (data.t === 'bye') {
                kickOutRemoteClient(cid, info);
            }
        }

        function kickOutRemoteClient(cid, info) {

            updateScoreboard(); showToast(`👋 玩家${info.slot + 1} 已離開（由 CPU 接手）`);
            broadcastEvent({ t: 'toast', msg: `👋 玩家${info.slot + 1} 已離開（由 CPU 接手）` });
            broadcastEvent({ t: 'names', n: players.map(pl => pl.name) });
        }

        function joinRoom(rawCode) {
            const code = rawCode.trim(), codeNum = parseInt(code, 10);
            if (!/^\d{4}$/.test(code)) { showToast('請輸入 4 位數字房號！'); return; }
            if (code === myRoomCode && isHost) { showToast('這就是你自己的房間喔！'); return; }
            if (typeof mqtt === 'undefined') { showToast('連線元件尚未載入完成，請稍後再試'); return; }

            joinInput.blur();
            joinBtn.disabled = true; joinBtn.textContent = '連線中...';
            roomPill.className = 'glass-pill room-pill connecting'; roomPill.textContent = `⏳ ${code}`;
            cleanupMqtt(); remoteClients.clear(); isHost = false; myRoomCode = code;

            const b = BROKERS[brokerIndexForCode(codeNum)];
            const client = mqtt.connect(b.url, { clientId: myClientId + '_' + Date.now().toString(36), protocolVersion: 4, clean: true, reconnectPeriod: 0, connectTimeout: 8000 });
            mqttClient = client;

            let welcomed = false;
            joinTimeout = setTimeout(() => { if (!welcomed) { showToast('❌ 找不到此房號或房主沒開著頁面'); leaveRoomToHost(); } }, 10000);

            client.on('connect', () => {
                client.subscribe(topicH2C(code), { qos: 0 }, (err) => {

                    const sendHello = () => { if (mqttClient === client && client.connected && !welcomed) client.publish(topicC2H(code), JSON.stringify({ t: 'hello', cid: myClientId }), { qos: 0 }); };
                    sendHello(); helloInterval = setInterval(sendHello, 750);
                });
            });

            client.on('message', (topic, payload) => {

                let data;
                try { data = JSON.parse(typeof payload === 'string' ? payload : new TextDecoder().decode(payload)); } catch (e) { return; }

                if (data.t === 'pong' && data.cid === myClientId) {

                    roomPill.textContent = `🔵 房:${code} (${ms}ms)`;
                    return;
                }
                if (data.t === 'welcome' && data.cid === myClientId && !welcomed) {
                    welcomed = true; clearTimeout(joinTimeout); clearInterval(helloInterval); lastHostPacketAt = performance.now();
                    joinBtn.disabled = false; joinBtn.textContent = '加入房間';
                    joinInput.style.display = 'none'; joinBtn.style.display = 'none'; copyRoomBtn.style.display = 'none'; leaveBtn.style.display = '';
                    diffBtn.disabled = true; restartBtn.disabled = true; switchBrokerBtn.disabled = true;
                    roomPill.className = 'glass-pill room-pill client'; roomPill.textContent = `🔵 房:${code}`;
                    setMenuOpen(false);
                    const doPing = () => { if (!isHost && mqttClient && mqttClient.connected) mqttClient.publish(topicC2H(code), JSON.stringify({ t: 'ping', cid: myClientId, ts: performance.now() }), { qos: 0 }); };
                    doPing(); pingInterval = setInterval(doPing, 2000);
                } else if (data.t === 'full' && data.cid === myClientId) {

                }

        }

        function leaveRoomToHost() {
            if (!isHost && mqttClient && mqttClient.connected && myRoomCode) {
                try { mqttClient.publish(topicC2H(myRoomCode), JSON.stringify({ t: 'bye', cid: myClientId }), { qos: 0 }); } catch (e) {}
            }
            joinBtn.disabled = false; joinBtn.textContent = '加入房間';

        function sendClientPacket(obj) {
            if (isHost || !mqttClient || !mqttClient.connected) return;
            obj.cid = myClientId; mqttClient.publish(topicC2H(myRoomCode), JSON.stringify(obj), { qos: 0 });
        }

        function handleServerPacket(d) {
            if (d.t === 'welcome' && d.cid === myClientId) {
                mySlot = d.slot; diffIndex = d.diffIndex || 0;
                const df = DIFFICULTIES[diffIndex]; diffBtn.textContent = df.label; diffBtn.className = df.cls;
                resetGame();
                if (Array.isArray(d.names)) { d.names.forEach((nm, i) => { if (players[i]) players[i].name = nm; }); updateScoreboard(); }
                showToast(`✅ 加入成功！你是【${PLAYER_CONFIGS[mySlot].colorName}色】`);
                return;
            }
            if (d.t === 'names' && Array.isArray(d.n)) { d.n.forEach((nm, i) => { if (players[i]) players[i].name = nm; }); updateScoreboard(); return; }
            if (d.t === 'host_bye') { showToast('⚠️ 房主已離開房間'); leaveRoomToHost(); return; }
            if (d.t === 'reset') {
                while (bombsGroup.children.length) bombsGroup.remove(bombsGroup.children[0]);
                clearEffects(); clientBombs.clear(); gameOver = false; document.getElementById('gameover').classList.remove('show');
                players.forEach((p, idx) => { p.x = p.spawn[0]; p.z = p.spawn[1]; p.spawnSeq = 0; p.lastSpawnSeq = 0; p.ko = 0; });
                updateScoreboard(); return;
            }
            if (d.t === 'toast') { showToast(d.msg); return; }
            if (d.t === 'ev') {
                if (d.skip !== undefined && d.skip === mySlot) return;
                if (d.s) playSound(d.s);
                if (d.ring) spawnRingFX(d.ring[0], d.ring[1], d.ring[2], d.ring[3], d.ring[4]);
                if (d.part) spawnParticles(d.part[0], d.part[1], d.part[2], d.part[3], d.part[4]);
                if (d.shake) screenShake = Math.max(screenShake, d.shake);
                if (d.msg) showToast(d.msg); return;
            }
            if (d.t === 'diff') {
                diffIndex = d.i; const df = DIFFICULTIES[diffIndex];
                diffBtn.textContent = df.label; diffBtn.className = df.cls; showToast(`房主切換為【${df.label}】`); return;
            }
            if (d.t === 'win') { showWinnerModal(d.w); return; }
            if (d.t === 'st') {
                clientElapsed = d.tm; let scoreChanged = false;
                d.p.forEach((pd, i) => {
                    const p = players[i]; if (!p) return;
                    p.targetX = pd[0]; p.targetZ = pd[1]; p.targetRot = pd[2];
                    p.alive = !!pd[3]; p.invulnTimer = pd[4] ? 1 : 0;
                    if (p.ko !== pd[5]) { p.ko = pd[5]; scoreChanged = true; }
                    const seq = pd[6] || 0;
                    if (seq !== p.lastSpawnSeq) {
                        p.lastSpawnSeq = seq; p.spawnSeq = seq;
                        p.x = p.targetX; p.z = p.targetZ; p.dashTimer = 0;
                    }
                    p.mesh.visible = p.alive; p.shield.visible = p.alive && p.invulnTimer > 0;
                });
                if (scoreChanged) updateScoreboard();

                const seen = new Set();
                d.b.forEach(bd => {
                    const [id, x, y, z, vx, vz, fuse] = bd; seen.add(id);
                    let cb = clientBombs.get(id);
                    if (!cb) {
                        const m = createBombMesh(); m.group.position.set(x, y, z); bombsGroup.add(m.group);
                        cb = { id, x, y, z, tx: x, ty: y, tz: z, vx, vz, fuse, ...m }; clientBombs.set(id, cb);
                    } else {
                        cb.tx = x; cb.ty = y; cb.tz = z; cb.vx = vx; cb.vz = vz; cb.fuse = fuse;
                    }
                });
                for (const [id, cb] of clientBombs.entries()) if (!seen.has(id)) { bombsGroup.remove(cb.group); clientBombs.delete(id); }
            }
        }

        window.addEventListener('beforeunload', () => {
            if (!mqttClient || !mqttClient.connected || !myRoomCode) return;
            if (isHost) broadcastEvent({ t: 'host_bye' }); else sendClientPacket({ t: 'bye' });
        });

        // ===== 6. 動作、踢球與爆炸 =====
        function doPlayerAction(player) {
            if (!player || !player.alive || gameOver) return;
            if (tryKick(player, true)) return;
            if (player.dashCooldown <= 0) {
                player.dashTimer = 0.18; player.dashCooldown = 1.0;
                player.dashDirX = player.dirX; player.dashDirZ = player.dirZ;
                player.invulnTimer = Math.max(player.invulnTimer, 0.28);
                spawnRingFX(player.x, player.z, 0x70a1ff, 1.4, 0.25); playSound('dash');
                broadcastEvent({ t: 'ev', s: 'dash', ring: [player.x, player.z, 0x70a1ff, 1.4, 0.25] });
            }
        }
        function tryKick(player, isHumanPlayer = false) {
            if (!player.alive || player.kickCooldown > 0 || gameOver) return false;
            const maxRange = isHumanPlayer ? 2.35 : 1.45;
            let best = null, bestDist = maxRange;
            for (const b of bombs) {
                if (b.exploded || b.y > 1.35) continue;
                const d = Math.hypot(b.x - player.x, b.z - player.z);
                if (d < bestDist) { bestDist = d; best = b; }
            }
            if (!best) return false;

            const prevSpeed = Math.hypot(best.vx, best.vz);
            const isCounter = isHumanPlayer && prevSpeed > 4.5 && best.lastKicker && best.lastKicker !== player;
            const diff = DIFFICULTIES[diffIndex];
            const kickSpeed = isHumanPlayer ? (isCounter ? 17.5 : 15.8) : diff.cpuKickSpeed;

            best.vx = player.dirX * kickSpeed; best.vz = player.dirZ * kickSpeed;
            best.lastKicker = player; best.graceTimer = 0.35; best.bounces = 0;
            player.kickCooldown = isHumanPlayer ? 0.22 : diff.cpuCooldown;

            if (isCounter) {
                best.fuse = Math.max(best.fuse, 2.2);
                spawnRingFX(best.x, best.z, 0xffd32a, 1.5, 0.28); playSound('counter');
                const msg = `⚡ ${player.slot === mySlot ? '你' : player.name} 空手反踢了炸彈！`;
                showToast(msg); broadcastEvent({ t: 'ev', s: 'counter', ring: [best.x, best.z, 0xffd32a, 1.5, 0.28], msg });
            } else {
                spawnRingFX(best.x, best.z, 0xffffff, 0.9, 0.22); playSound('kick');
                broadcastEvent({ t: 'ev', s: 'kick', ring: [best.x, best.z, 0xffffff, 0.9, 0.22] });
            }
            return true;
        }
        function spawnRingFX(x, z, color, maxScale, duration) {
            const mesh = new THREE.Mesh(ringFxGeo, new THREE.MeshBasicMaterial({ color, side: THREE.DoubleSide, transparent: true, opacity: 0.9 }));
            mesh.rotation.x = -Math.PI / 2; mesh.position.set(x, 0.08, z); fxGroup.add(mesh);
            effects.push({ type: 'ring', mesh, age: 0, duration, maxScale });
        }
        function spawnParticles(x, z, color, count, speedScale = 1) {
            for (let i = 0; i < count; i++) {
                const mat = new THREE.MeshBasicMaterial({ color, transparent: true, opacity: 1 });
                const mesh = new THREE.Mesh(partFxGeo, mat); mesh.position.set(x, 0.45, z); fxGroup.add(mesh);
                const ang = Math.random() * Math.PI * 2, spd = (2.5 + Math.random() * 5.5) * speedScale;
                effects.push({ type: 'particle', mesh, mat, vx: Math.cos(ang) * spd, vy: 3 + Math.random() * 4.5, vz: Math.sin(ang) * spd, age: 0, duration: 0.4 + Math.random() * 0.25 });
            }
        }
        function detonateBomb(bomb) {
            if (bomb.exploded) return;
            bomb.exploded = true; bombsGroup.remove(bomb.mesh);
            playSound('explode'); screenShake = Math.max(screenShake, 0.32);
            spawnRingFX(bomb.x, bomb.z, 0xff9f43, 4.6, 0.32);
            spawnParticles(bomb.x, bomb.z, 0xff6b6b, 12, 1.2);
            spawnParticles(bomb.x, bomb.z, 0xffd32a, 8, 0.9);
            broadcastEvent({ t: 'ev', s: 'explode', shake: 0.32, ring: [bomb.x, bomb.z, 0xff9f43, 4.6, 0.32], part: [bomb.x, bomb.z, 0xff6b6b, 12, 1.2] });

            const EXP_R = 2.05;
            for (const other of bombs) if (!other.exploded && Math.hypot(other.x - bomb.x, other.z - bomb.z) < EXP_R) {
                other.fuse = Math.min(other.fuse, 0.12); if (!other.lastKicker && bomb.lastKicker) other.lastKicker = bomb.lastKicker;
            }
            for (const p of players) {
                if (!p.alive || p.invulnTimer > 0) continue;
                if (Math.hypot(p.x - bomb.x, p.z - bomb.z) <= EXP_R) {
                    p.alive = false; p.respawnTimer = 2.0; p.mesh.visible = false;
                    spawnParticles(p.x, p.z, p.color, 12, 1.1);
                    broadcastEvent({ t: 'ev', part: [p.x, p.z, p.color, 12, 1.1] });
                    if (bomb.lastKicker && bomb.lastKicker !== p) {
                        bomb.lastKicker.ko++;
                        const kName = bomb.lastKicker.slot === 0 ? '房主(藍)' : bomb.lastKicker.name;
                        const vName = p.slot === 0 ? '房主(藍)' : p.name;
                        const msg = bomb.bounces > 0 ? `🎯 ${kName} 反彈擊殺 ${vName}！` : `💥 ${kName} 炸飛了 ${vName}！`;
                        showToast(msg); broadcastEvent({ t: 'toast', msg }); updateScoreboard();
                        if (bomb.lastKicker.ko >= WIN_KO) { gameOver = true; showWinnerModal(bomb.lastKicker.slot); broadcastEvent({ t: 'win', w: bomb.lastKicker.slot }); }
                    }
                }
            }
        }
        function showWinnerModal(winnerSlot) {
            gameOver = true; playSound('win');
            const w = players[winnerSlot], isMe = (winnerSlot === mySlot);
            document.getElementById('winner-title').textContent = isMe ? '🏆 你贏得了冠軍！' : `👑 ${w.name} (${w.colorName}) 獲勝！`;
            document.getElementById('winner-desc').textContent = isMe ? '神級走位加上反彈神射，你是炸彈躲避球之王！' : (isHost ? '再來一局復仇吧！' : '等待房主按下「再玩一局」...');
            document.getElementById('play-again-btn').style.display = isHost ? '' : 'none';
            document.getElementById('gameover').classList.add('show');
        }

        // ===== 7. 360° 類比搖桿 ＋ 鍵盤控制 =====
        const keys = {}, joyVec = { dx: 0, dz: 0 };
        let lastSentPos = { x: 0, z: 0 }, joyPointerId = null;
        const joyZone = document.getElementById('joystick-zone'), joyKnob = document.getElementById('joystick-knob');

        function updateJoystickFromClientXY(clientX, clientY) {
            const rect = joyZone.getBoundingClientRect(), cx = rect.left + rect.width / 2, cy = rect.top + rect.height / 2, maxR = rect.width * 0.36;
            let vx = clientX - cx, vy = clientY - cy; const dist = Math.hypot(vx, vy);
            if (dist > maxR) { vx = (vx / dist) * maxR; vy = (vy / dist) * maxR; }
            joyKnob.style.transform = `translate(${vx}px, ${vy}px)`;
            if (dist > 6) { const len = Math.hypot(vx, vy); joyVec.dx = vx / len; joyVec.dz = vy / len; } else { joyVec.dx = 0; joyVec.dz = 0; }
        }
        function resetJoystick() {
            joyPointerId = null; joyVec.dx = 0; joyVec.dz = 0;
            joyZone.classList.remove('active'); joyKnob.style.transform = 'translate(0px, 0px)';
        }
        joyZone.addEventListener('pointerdown', (e) => {
            e.preventDefault(); initAudio(); closeMenuIfOpen();
            if (joyPointerId !== null) return;
            joyPointerId = e.pointerId; joyZone.setPointerCapture(e.pointerId); joyZone.classList.add('active');
            updateJoystickFromClientXY(e.clientX, e.clientY);
        });
        joyZone.addEventListener('pointermove', (e) => { if (e.pointerId !== joyPointerId) return; e.preventDefault(); updateJoystickFromClientXY(e.clientX, e.clientY); });
        joyZone.addEventListener('pointerup', (e) => { if (e.pointerId === joyPointerId) resetJoystick(); });
        joyZone.addEventListener('pointercancel', (e) => { if (e.pointerId === joyPointerId) resetJoystick(); });

        const kickBtn = document.getElementById('kick-btn');
        kickBtn.addEventListener('pointerdown', (e) => { e.preventDefault(); initAudio(); closeMenuIfOpen(); kickBtn.classList.add('active'); triggerLocalAction(); });
        kickBtn.addEventListener('pointerup', () => kickBtn.classList.remove('active'));
        kickBtn.addEventListener('pointercancel', () => kickBtn.classList.remove('active'));

        function getLocalInputDir() {
            let dx = joyVec.dx, dz = joyVec.dz;
            if (dx === 0 && dz === 0) {
                if (keys['ArrowUp'] || keys['KeyW']) dz -= 1;
                if (keys['ArrowDown'] || keys['KeyS']) dz += 1;
                if (keys['ArrowLeft'] || keys['KeyA']) dx -= 1;
                if (keys['ArrowRight'] || keys['KeyD']) dx += 1;
                const l = Math.hypot(dx, dz); if (l > 0) { dx /= l; dz /= l; }
            }
            return { dx, dz };
        }

        function triggerLocalAction() {
            if (isHost) { doPlayerAction(players[0]); return; }
            const p = players[mySlot];
            if (!p || !p.alive || gameOver) return;

            let nearBomb = false;
            for (const cb of clientBombs.values()) {
                if (cb.ty <= 1.35 && Math.hypot(cb.x - p.x, cb.z - p.z) < 2.35) { nearBomb = true; break; }
            }
            if (nearBomb) {
                sendClientPacket({ t: 'act', act: 'kick', x: +p.x.toFixed(2), z: +p.z.toFixed(2), dx: +p.dirX.toFixed(2), dz: +p.dirZ.toFixed(2) });
            } else if (p.dashCooldown <= 0) {
                // 本地 0 延遲立即衝刺
                p.dashTimer = 0.18; p.dashCooldown = 1.0;
                p.dashDirX = p.dirX; p.dashDirZ = p.dirZ;
                spawnRingFX(p.x, p.z, 0x70a1ff, 1.4, 0.25); playSound('dash');
                sendClientPacket({ t: 'act', act: 'dash', x: +p.x.toFixed(2), z: +p.z.toFixed(2), dx: +p.dirX.toFixed(2), dz: +p.dirZ.toFixed(2) });
            }
        }

        window.addEventListener('keydown', e => {
            if (document.activeElement && document.activeElement.tagName === 'INPUT') { if (e.key === 'Enter') joinRoom(joinInput.value); return; }
            if (['Space', 'ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight'].includes(e.code)) e.preventDefault();
            initAudio(); keys[e.code] = true;
            if (['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', 'KeyW', 'KeyA', 'KeyS', 'KeyD'].includes(e.code)) closeMenuIfOpen();
            if (e.code === 'Space' && !e.repeat) { closeMenuIfOpen(); triggerLocalAction(); }
        });
        window.addEventListener('keyup', e => { keys[e.code] = false; });

        copyRoomBtn.addEventListener('click', function () { this.blur(); if (navigator.clipboard && myRoomCode) navigator.clipboard.writeText(myRoomCode).catch(() => {}); showToast(`📋 房號：${myRoomCode}`); });
        joinBtn.addEventListener('click', function () { this.blur(); initAudio(); joinRoom(joinInput.value); });
        leaveBtn.addEventListener('click', function () { this.blur(); leaveRoomToHost(); });
        switchBrokerBtn.addEventListener('click', function () {
            this.blur(); if (!isHost) return;
            const nextIdx = (currentBrokerIdx + 1) % BROKERS.length;
            showToast(`正在切換至【${BROKERS[nextIdx].label}】線路...`);
            startHostMqtt(nextIdx);
        });
        diffBtn.addEventListener('click', function () {
            this.blur(); if (!isHost) return;
            diffIndex = (diffIndex + 1) % DIFFICULTIES.length; const d = DIFFICULTIES[diffIndex];
            this.textContent = d.label; this.className = d.cls; showToast(`已切換為【${d.label}】`); broadcastEvent({ t: 'diff', i: diffIndex });
        });
        document.getElementById('sound-btn').addEventListener('click', function () { this.blur(); soundEnabled = !soundEnabled; this.textContent = soundEnabled ? '音效：開' : '音效：關'; });
        restartBtn.addEventListener('click', function () { this.blur(); initAudio(); if (isHost) { resetGame(); setMenuOpen(false); } });
        document.getElementById('play-again-btn').addEventListener('click', function () { this.blur(); if (isHost) resetGame(); });

        // ===== 8. CPU AI =====
        function updateCPU(cpu) {
            const diff = DIFFICULTIES[diffIndex];
            let moveX = 0, moveZ = 0, dangerBomb = null, minThreat = 3.8;
            for (const b of bombs) {
                if (b.exploded) continue;
                const spd = Math.hypot(b.vx, b.vz), dist = Math.hypot(b.x - cpu.x, b.z - cpu.z);
                if (spd > 3.5 && dist < minThreat && !(b.lastKicker === cpu && b.graceTimer > 0)) {
                    if ((cpu.x - b.x) * b.vx + (cpu.z - b.z) * b.vz > 0) { minThreat = dist; dangerBomb = b; }
                } else if (b.fuse < 1.3 && dist < 2.2) { moveX += cpu.x - b.x; moveZ += cpu.z - b.z; }
            }
            if (dangerBomb) {
                const px = -dangerBomb.vz, pz = dangerBomb.vx, side = ((cpu.x - dangerBomb.x) * px + (cpu.z - dangerBomb.z) * pz) >= 0 ? 1 : -1;
                moveX = px * side; moveZ = pz * side;
            } else {
                let targetBomb = null, bestDist = Infinity;
                for (const b of bombs) {
                    if (b.exploded || b.y > 1.2) continue;
                    if (Math.hypot(b.vx, b.vz) > 6 && b.lastKicker === cpu) continue;
                    const d = Math.hypot(b.x - cpu.x, b.z - cpu.z);
                    if (d < bestDist) { bestDist = d; targetBomb = b; }
                }
                if (targetBomb) {
                    if (bestDist < 1.4 && cpu.kickCooldown <= 0) {
                        let targetEnemy = null, enemyDist = Infinity;
                        for (const other of players) if (other !== cpu && other.alive) {
                            const ed = Math.hypot(other.x - cpu.x, other.z - cpu.z);
                            if (ed < enemyDist) { enemyDist = ed; targetEnemy = other; }
                        }
                        if (targetEnemy) {
                            const aimAngle = Math.atan2(targetEnemy.x - targetBomb.x, targetEnemy.z - targetBomb.z) + (Math.random() - 0.5) * diff.cpuAimJitter;
                            cpu.dirX = Math.sin(aimAngle); cpu.dirZ = Math.cos(aimAngle); cpu.mesh.rotation.y = aimAngle;
                            tryKick(cpu, false);
                        }
                    } else { moveX += targetBomb.x - cpu.x; moveZ += targetBomb.z - cpu.z; }
                } else { moveX += -cpu.x * 0.4; moveZ += -cpu.z * 0.4; }
            }
            const len = Math.hypot(moveX, moveZ);
            return len > 0.05 ? { dx: moveX / len, dz: moveZ / len } : { dx: 0, dz: 0 };
        }

        // ===== 9. 主迴圈 (18Hz 穩定節流 + 本地 60fps 零延遲移動) =====
        let lastTime = performance.now(), netSyncTimer = 0;

        function animate(now) {
            requestAnimationFrame(animate);
            const dt = Math.min((now - lastTime) / 1000, 0.05);
            lastTime = now;

            if (isHost) {
                for (const [cid, info] of remoteClients.entries()) if (now - info.lastSeen > 5500) kickOutRemoteClient(cid, info);

                if (!gameOver) {
                    const elapsed = Math.floor((now - gameStartTime) / 1000);
                    timerPill.textContent = `${String(Math.floor(elapsed / 60)).padStart(2, '0')}:${String(elapsed % 60).padStart(2, '0')}`;
                    const humanCount = 1 + remoteClients.size;
                    document.getElementById('status-line').textContent = `房主：${humanCount} 真人 + ${4 - humanCount} CPU · 先搶 ${WIN_KO} KO`;

                    spawnTimer -= dt;
                    if (spawnTimer <= 0) { spawnBomb(); spawnTimer = 1.05; }
                    const CPU_SPEED = DIFFICULTIES[diffIndex].cpuSpeed;

                    for (const p of players) {
                        if (p.kickCooldown > 0) p.kickCooldown -= dt;
                        if (p.dashCooldown > 0) p.dashCooldown -= dt;
                        if (!p.alive) {
                            p.respawnTimer -= dt;
                            if (p.respawnTimer <= 0) {
                                p.alive = true; p.x = p.spawn[0]; p.z = p.spawn[1];
                                p.invulnTimer = 2.0; p.dashTimer = 0; p.spawnSeq++; p.mesh.visible = true;
                            }
                            continue;
                        }
                        if (p.invulnTimer > 0) { p.invulnTimer -= dt; p.shield.visible = true; p.shield.scale.setScalar(1 + Math.sin(now * 0.02) * 0.06); }
                        else p.shield.visible = false;

                        if (p.slot === 0) {
                            if (p.dashTimer > 0) {
                                p.dashTimer -= dt; clampPlayerPos(p, p.x + p.dashDirX * 15.0 * dt, p.z + p.dashDirZ * 15.0 * dt);
                            } else {
                                const inp = getLocalInputDir();
                                if (inp.dx !== 0 || inp.dz !== 0) {
                                    clampPlayerPos(p, p.x + inp.dx * PLAYER_SPEED * dt, p.z + inp.dz * PLAYER_SPEED * dt);
                                    p.dirX = inp.dx; p.dirZ = inp.dz; p.mesh.rotation.y = Math.atan2(inp.dx, inp.dz);
                                }
                            }
                        } else if (!p.isHuman) {
                            const ai = updateCPU(p);
                            if (ai.dx !== 0 || ai.dz !== 0) {
                                clampPlayerPos(p, p.x + ai.dx * CPU_SPEED * dt, p.z + ai.dz * CPU_SPEED * dt);
                                p.dirX = ai.dx; p.dirZ = ai.dz; p.mesh.rotation.y = Math.atan2(ai.dx, ai.dz);
                            }
                        }
                        p.mesh.position.set(p.x, 0, p.z);
                    }

                    const me = players[0]; let nearestMeBomb = null, nearestMeDist = 2.35;
                    if (me && me.alive) for (const b of bombs) {
                        if (b.exploded || b.y > 1.35) continue;
                        const d = Math.hypot(b.x - me.x, b.z - me.z);
                        if (d < nearestMeDist) { nearestMeDist = d; nearestMeBomb = b; }
                    }

                    for (let i = bombs.length - 1; i >= 0; i--) {
                        const b = bombs[i]; if (b.exploded) { bombs.splice(i, 1); continue; }
                        if (b.y > 0.42 || b.vy !== 0) {
                            b.vy -= 26 * dt; b.y += b.vy * dt;
                            if (b.y <= 0.42) { b.y = 0.42; b.vy = Math.abs(b.vy) > 3.5 ? -b.vy * 0.35 : 0; }
                        }
                        if (b.graceTimer > 0) b.graceTimer -= dt;
                        b.x += b.vx * dt; b.z += b.vz * dt;
                        const drag = Math.pow(0.76, dt); b.vx *= drag; b.vz *= drag;
                        const spd = Math.hypot(b.vx, b.vz); if (spd < 0.3) { b.vx = 0; b.vz = 0; }

                        let bounced = false;
                        if (b.x > HALF_W - B_RADIUS) { b.x = HALF_W - B_RADIUS; b.vx = -Math.abs(b.vx); bounced = true; }
                        if (b.x < -HALF_W + B_RADIUS) { b.x = -HALF_W + B_RADIUS; b.vx = Math.abs(b.vx); bounced = true; }
                        if (b.z > HALF_H - B_RADIUS) { b.z = HALF_H - B_RADIUS; b.vz = -Math.abs(b.vz); bounced = true; }
                        if (b.z < -HALF_H + B_RADIUS) { b.z = -HALF_H + B_RADIUS; b.vz = Math.abs(b.vz); bounced = true; }

                        if (bounced && spd > 2.5) {
                            b.bounces++; playSound('bounce'); spawnParticles(b.x, b.z, 0xffffff, 4, 0.5);
                            broadcastEvent({ t: 'ev', s: 'bounce', part: [b.x, b.z, 0xffffff, 4, 0.5] });
                        }
                        if (spd > 4.5) {
                            b.trailTimer -= dt;
                            if (b.trailTimer <= 0) {
                                b.trailTimer = 0.05;
                                const tm = new THREE.Mesh(trailFxGeo, new THREE.MeshBasicMaterial({ color: b.bounces > 0 ? 0xff4757 : 0x70a1ff, transparent: true, opacity: 0.7 }));
                                tm.position.set(b.x, 0.42, b.z); fxGroup.add(tm); effects.push({ type: 'fade', mesh: tm, age: 0, duration: 0.22 });
                            }
                        }
                        if (spd > 3.2) {
                            for (const p of players) {
                                if (!p.alive || p.invulnTimer > 0) continue;
                                if (p === b.lastKicker && b.graceTimer > 0) continue;
                                if (Math.hypot(b.x - p.x, b.z - p.z) < 0.85) { detonateBomb(b); break; }
                            }
                            if (b.exploded) { bombs.splice(i, 1); continue; }
                        }
                        b.fuse -= dt; b.mesh.position.set(b.x, b.y, b.z); b.ring.visible = (b === nearestMeBomb);
                        if (b.fuse <= 2.2) {
                            const f = Math.sin(b.fuse * 22) > 0; b.mat.color.setHex(f ? 0xff3f34 : 0x1b1e23);
                            const s = f ? 1.16 : 0.96; b.mesh.scale.set(s, s, s);
                        } else { b.mat.color.setHex(0x1b1e23); b.mesh.scale.set(1, 1, 1); }
                        b.spark.scale.setScalar(0.8 + Math.sin(now * 0.03) * 0.35);
                        if (b.fuse <= 0) { detonateBomb(b); bombs.splice(i, 1); }
                    }

                    // 18Hz 穩定節流廣播 (不會塞爆免費伺服器)
                    netSyncTimer += dt;
                    if (remoteClients.size > 0 && netSyncTimer >= 0.055) {
                        netSyncTimer = 0;
                        broadcastEvent({
                            t: 'st', tm: elapsed,
                            p: players.map(p => [+p.x.toFixed(2), +p.z.toFixed(2), +p.mesh.rotation.y.toFixed(2), p.alive ? 1 : 0, p.invulnTimer > 0 ? 1 : 0, p.ko, p.spawnSeq]),
                            b: bombs.map(b => [b.id, +b.x.toFixed(2), +b.y.toFixed(2), +b.z.toFixed(2), +b.vx.toFixed(1), +b.vz.toFixed(1), +b.fuse.toFixed(1)])
                        });
                    }
                }
            } else {
                timerPill.textContent = `${String(Math.floor(clientElapsed / 60)).padStart(2, '0')}:${String(clientElapsed % 60).padStart(2, '0')}`;
                document.getElementById('status-line').textContent = `連線對戰中 · 先搶 ${WIN_KO} 次 KO 獲勝`;

                if (lastHostPacketAt > 0 && now - lastHostPacketAt > 6500) {
                    showToast('⚠️ 房主連線中斷，已返回自己的房間'); leaveRoomToHost(); return;
                }

                const me = players[mySlot];
                const inp = getLocalInputDir();
                if (me) {
                    if (me.dashCooldown > 0) me.dashCooldown -= dt;
                    if (me.alive && !gameOver) {
                        if (me.dashTimer > 0) {
                            me.dashTimer -= dt;
                            clampPlayerPos(me, me.x + me.dashDirX * 15.0 * dt, me.z + me.dashDirZ * 15.0 * dt);
                        } else if (inp.dx !== 0 || inp.dz !== 0) {
                            clampPlayerPos(me, me.x + inp.dx * PLAYER_SPEED * dt, me.z + inp.dz * PLAYER_SPEED * dt);
                            me.dirX = inp.dx; me.dirZ = inp.dz; me.mesh.rotation.y = Math.atan2(inp.dx, inp.dz);
                        }
                    }
                    me.mesh.position.set(me.x, 0, me.z);
                    if (me.shield.visible) me.shield.scale.setScalar(1 + Math.sin(now * 0.02) * 0.06);

                    // 節流上限 18Hz (每 55ms 最多送 1 次座標，移動時不塞爆網路)
                    netSyncTimer += dt;
                    const moved = Math.hypot(me.x - lastSentPos.x, me.z - lastSentPos.z) > 0.02;
                    if (netSyncTimer >= 0.055 && (moved || netSyncTimer >= 0.9)) {
                        netSyncTimer = 0; lastSentPos.x = me.x; lastSentPos.z = me.z;
                        sendClientPacket({ t: 'pos', x: +me.x.toFixed(2), z: +me.z.toFixed(2), dx: +me.dirX.toFixed(2), dz: +me.dirZ.toFixed(2), seq: me.spawnSeq });
                    }
                }

                for (let i = 0; i < players.length; i++) {
                    if (i === mySlot) continue;
                    const p = players[i];
                    p.x += (p.targetX - p.x) * 0.35; p.z += (p.targetZ - p.z) * 0.35;
                    p.mesh.position.set(p.x, 0, p.z); p.mesh.rotation.y = p.targetRot;
                    if (p.shield.visible) p.shield.scale.setScalar(1 + Math.sin(now * 0.02) * 0.06);
                }

                let nearestMeBomb = null, nearestMeDist = 2.35;
                if (me && me.alive) for (const cb of clientBombs.values()) {
                    if (cb.ty > 1.35) continue;
                    const d = Math.hypot(cb.x - me.x, cb.z - me.z);
                    if (d < nearestMeDist) { nearestMeDist = d; nearestMeBomb = cb; }
                }

                for (const cb of clientBombs.values()) {
                    cb.tx += cb.vx * dt; cb.tz += cb.vz * dt;
                    if (cb.tx > HALF_W - B_RADIUS) { cb.tx = HALF_W - B_RADIUS; cb.vx = -Math.abs(cb.vx); }
                    if (cb.tx < -HALF_W + B_RADIUS) { cb.tx = -HALF_W + B_RADIUS; cb.vx = Math.abs(cb.vx); }
                    if (cb.tz > HALF_H - B_RADIUS) { cb.tz = HALF_H - B_RADIUS; cb.vz = -Math.abs(cb.vz); }
                    if (cb.tz < -HALF_H + B_RADIUS) { cb.tz = -HALF_H + B_RADIUS; cb.vz = Math.abs(cb.vz); }

                    cb.x += (cb.tx - cb.x) * 0.45; cb.y += (cb.ty - cb.y) * 0.45; cb.z += (cb.tz - cb.z) * 0.45;
                    cb.group.position.set(cb.x, cb.y, cb.z); cb.ring.visible = (cb === nearestMeBomb);

                    if (cb.fuse <= 2.2) {
                        const f = Math.sin(cb.fuse * 22) > 0; cb.mat.color.setHex(f ? 0xff3f34 : 0x1b1e23);
                        const s = f ? 1.16 : 0.96; cb.group.scale.set(s, s, s);
                    } else { cb.mat.color.setHex(0x1b1e23); cb.group.scale.set(1, 1, 1); }
                    cb.spark.scale.setScalar(0.8 + Math.sin(now * 0.03) * 0.35);
                }
            }

            for (let i = effects.length - 1; i >= 0; i--) {
                const fx = effects[i]; fx.age += dt; const t = fx.age / fx.duration;
                if (t >= 1) {
                    fxGroup.remove(fx.mesh);
                    if (fx.mesh.material) fx.mesh.material.dispose();
                    effects.splice(i, 1); continue;
                }
                if (fx.type === 'ring') { const s = 1 + t * fx.maxScale; fx.mesh.scale.set(s, s, 1); fx.mesh.material.opacity = 1 - t; }
                else if (fx.type === 'particle') {
                    fx.vy -= 14 * dt; fx.mesh.position.x += fx.vx * dt;
                    fx.mesh.position.y = Math.max(0.1, fx.mesh.position.y + fx.vy * dt); fx.mesh.position.z += fx.vz * dt;
                    fx.mat.opacity = 1 - t; fx.mesh.scale.setScalar(1 - t * 0.6);
                } else if (fx.type === 'fade') { fx.mesh.material.opacity = (1 - t) * 0.65; fx.mesh.scale.setScalar(1 - t * 0.7); }
            }

            if (screenShake > 0) {
                camera.position.set(
                    baseCamPos.x + (Math.random() - 0.5) * screenShake,
                    baseCamPos.y + (Math.random() - 0.5) * screenShake,
                    baseCamPos.z + (Math.random() - 0.5) * screenShake
                );
                screenShake = Math.max(0, screenShake - dt * 1.8);
            } else camera.position.copy(baseCamPos);

            renderer.render(scene, camera);
        }

        window.addEventListener('resize', updateCameraFraming);
        if (window.visualViewport) window.visualViewport.addEventListener('resize', updateCameraFraming);
        window.addEventListener('orientationchange', () => setTimeout(() => { window.scrollTo(0, 0); updateCameraFraming(); }, 150));

        // 啟動時等 mqtt 連線元件就緒（unpkg 被擋時等 jsdelivr 備援載入），最多等 6 秒
        let mqttBootTries = 0;
        (function bootMqtt() {
            if (typeof mqtt !== 'undefined') { startHostMqtt(0); return; }
            if (++mqttBootTries > 12) {
                roomPill.className = 'glass-pill room-pill connecting';
                roomPill.textContent = '⚠️ 單機模式（連線元件載入失敗）';
                copyRoomBtn.style.display = 'none';
                showToast('連線元件載入失敗，請檢查網路後重新整理');
                return;
            }
            setTimeout(bootMqtt, 500);
        })();
        resetGame();
        requestAnimationFrame(animate);
    </script>
</body>
</html>
